# Example: Android Pre-release Workflow (Tag-Based)
# Place this in your app repo at: .github/workflows/flutter-android-prerelease.yml
#
# This workflow demonstrates pre-release builds triggered by tags with
# suffixes like -alpha, -dev, -beta, -rc.
#
# Key point: The tag suffix determines the prerelease status and flavor.
# - Tags without suffix (e.g., v1.0.0) → prerelease: false (stable release), flavor=stable
# - Tags with -alpha suffix → prerelease: true, flavor=alpha
# - Tags with -beta suffix → prerelease: true, flavor=beta
# - The parse-tag.sh script extracts flavor from the tag suffix automatically.
#
# Example tags and their behavior:
#   v1.0.0          → stable, version 1.0.0, flavor=stable, prerelease: false, APK_SUFFIX=""
#   v1.0.0-alpha    → pre-release, version 1.0.0-alpha, flavor=alpha, prerelease: true, APK_SUFFIX="-alpha"
#   v1.0.0-beta     → pre-release, version 1.0.0-beta, flavor=beta, prerelease: true, APK_SUFFIX="-beta"

name: "PearPin Pre-release"

on:
  push:
    tags:
      - "asdfadfasdfasdfasldkfadklfalskfqeiorupqweoiu"                           # all tags starting with v
jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      FLUTTER_BASE: "."               # set per app: "." or subfolder name
      MAIN_FILE: "main.dart"
      DEFAULT_FLAVOR: "prod"          # used when tag has no -<flavor> suffix

    steps:
      - name: "Clone app repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: "Checkout workflows repo (android scripts)"
        uses: actions/checkout@v4
        with:
          repository: sunnydodti/workflows
          token: ${{ secrets.BUILD_INFO_TOKEN }}
          path: workflows
          ref: android                      # pinned to android branch for v1 stability

      - name: "Parse tag version and flavor"
        run: |
          chmod +x workflows/scripts/flutter/android/parse-tag.sh
          workflows/scripts/flutter/android/parse-tag.sh "${{ github.ref_name }}"
        # Outputs: APP_VERSION, BUILD_NUMBER, FLAVOR, APK_SUFFIX, IS_PRERELEASE
        # The tag suffix (-alpha, -beta) is parsed to:
        #   - FLAVOR: the token before the first dot (e.g. alpha, beta)
        #   - APK_SUFFIX: "-<flavor>" (appended to APK filename)
        #   - IS_PRERELEASE: "true" for any -suffix tag, "false" for stable

      - name: "Set up Java"
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"

      - name: "Set up Flutter"
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: "${{ env.FLUTTER_BASE }}/pubspec.yaml"

      - name: "Setup Android SDK"
        run: |
          chmod +x workflows/scripts/flutter/android/setup-android-sdk.sh
          workflows/scripts/flutter/android/setup-android-sdk.sh

      - name: "Decode keystore"
        env:
          KEYSTORE_PATH: "${{ github.workspace }}/keystore.jks"
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > "$KEYSTORE_PATH"

      - name: "Build APK"
        run: |
          chmod +x workflows/scripts/flutter/android/build-apk.sh
          workflows/scripts/flutter/android/build-apk.sh "$FLUTTER_BASE" "$FLAVOR" "$MAIN_FILE" "$APP_VERSION" "$BUILD_NUMBER"
        # Builds with --build-name and --build-number from tag

      - name: "Sign APK"
        env:
          KEYSTORE_PATH: "${{ github.workspace }}/keystore.jks"
        run: |
          chmod +x workflows/scripts/flutter/android/sign-apk.sh
          workflows/scripts/flutter/android/sign-apk.sh "$FLUTTER_BASE" "$APK_SUFFIX" "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" "${{ secrets.KEY_PASSWORD }}"

      - name: "Rename APK"
        run: |
          chmod +x workflows/scripts/flutter/android/rename-apk.sh
          workflows/scripts/flutter/android/rename-apk.sh "$FLUTTER_BASE" "${{ vars.APP_NAME }}" "$APK_SUFFIX" "$APP_VERSION"
        # Renames to: pearpin_1.0.0-alpha_arm64-v8a-release.apk (with -alpha suffix)

      - name: "Create Release (pre-release)"
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ env.FLUTTER_BASE }}/build/app/outputs/flutter-apk/*.apk"
          tag: "${{ github.ref_name }}"
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}   # true for -alpha, -beta tags
          token: ${{ secrets.RELEASE_TOKEN }}