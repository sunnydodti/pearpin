name: "Deploy to GitHub Pages"

on:
  workflow_run:
    workflows: ["PearPin Release"]
    types:
      - completed
    branches: [main]

jobs:
  deploy-to-github-pages:
    runs-on: ubuntu-latest
    env:
      FLUTTER_BASE: "."
      MAIN_FILE: "main.dart"
      PAGES_ENABLED: "true"
      PAGES_TAG_REGEX: '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)(\.[0-9]+)?)?$'

    steps:
      - name: "Check tag eligibility for GitHub Pages"
        id: check_tag
        run: |
          echo "Evaluating PAGES_ENABLED: ${{ env.PAGES_ENABLED }}"
          if [[ "${{ env.PAGES_ENABLED }}" != "true" ]]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HEAD_REF="${{ github.event.workflow_run.head_branch }}"
          TAG_REGEX="${{ env.PAGES_TAG_REGEX }}"
          echo "Evaluating ref '$HEAD_REF' against pattern '$TAG_REGEX'"
          if [[ "$HEAD_REF" =~ $TAG_REGEX ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Checkout tagged commit"
        if: steps.check_tag.outputs.should_deploy == 'true'
        uses: actions/checkout@v4
        with:
          ref: "${{ github.event.workflow_run.head_sha }}"

      - name: "Set up Flutter"
        if: steps.check_tag.outputs.should_deploy == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: "${{ env.FLUTTER_BASE }}/pubspec.yaml"

      - name: "Enable web"
        if: steps.check_tag.outputs.should_deploy == 'true'
        run: flutter config --enable-web

      - name: "Get dependencies"
        if: steps.check_tag.outputs.should_deploy == 'true'
        working-directory: "${{ env.FLUTTER_BASE }}"
        run: flutter pub get

      - name: "Build web"
        if: steps.check_tag.outputs.should_deploy == 'true'
        working-directory: "${{ env.FLUTTER_BASE }}"
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: "Deploy to GitHub Pages"
        if: steps.check_tag.outputs.should_deploy == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.RELEASE_TOKEN }}
          publish_dir: "${{ env.FLUTTER_BASE }}/build/web"
          user_name: "github-ci[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy to GitHub Pages"