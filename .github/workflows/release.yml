# Example: Android Release Workflow (Tag-Based)
# Place this in your app repo at: .github/workflows/flutter-android-release.yml
#
# This workflow handles stable and pre-release builds triggered by tags.
#
# Tag convention:
#   v1.0.0          → stable, version 1.0.0, flavor=stable, prerelease=false
#   v1.0.0-alpha    → pre-release, version 1.0.0-alpha, flavor=alpha, prerelease=true
#   v1.0.0-beta     → pre-release, version 1.0.0-beta, flavor=beta, prerelease=true
#   v1.0.0-dev      → pre-release, version 1.0.0-dev, flavor=dev, prerelease=true
#
# parse-tag.sh extracts flavor from the tag suffix automatically.

name: "PearPin Release"

on:
  push:
    tags:
      - "v*"
      - "v[0-9]+.[0-9]+.[0-9]+-*-*"

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      FLUTTER_BASE: "."
      MAIN_FILE: "main.dart"

    steps:
      - name: "Clone app repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: "Checkout workflows repo"
        uses: actions/checkout@v4
        with:
          repository: sunnydodti/workflows
          token: ${{ secrets.BUILD_INFO_TOKEN }}
          path: workflows
          ref: v1

      - name: "Parse tag version and flavor"
        run: |
          chmod +x workflows/scripts/flutter/android/parse-tag.sh
          workflows/scripts/flutter/android/parse-tag.sh "${{ github.ref_name }}"

      - name: "Set up Java"
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"

      - name: "Set up Flutter"
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: "${{ env.FLUTTER_BASE }}/pubspec.yaml"

      - name: "Setup Android SDK"
        run: |
          chmod +x workflows/scripts/android/setup-android-sdk.sh
          workflows/scripts/android/setup-android-sdk.sh

      - name: "Decode keystore"
        env:
          KEYSTORE_PATH: "${{ github.workspace }}/keystore.jks"
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > "$KEYSTORE_PATH"

      - name: "Build APK"
        run: |
          chmod +x workflows/scripts/flutter/android/build-apk.sh
          workflows/scripts/flutter/android/build-apk.sh "$FLUTTER_BASE" "$FLAVOR" "$MAIN_FILE" "$APP_VERSION" "$BUILD_NUMBER"

      - name: "Sign APK"
        env:
          KEYSTORE_PATH: "${{ github.workspace }}/keystore.jks"
        run: |
          chmod +x workflows/scripts/flutter/android/sign-apk.sh
          workflows/scripts/flutter/android/sign-apk.sh "$FLUTTER_BASE" "$APK_SUFFIX" "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" "${{ secrets.KEY_PASSWORD }}"

      - name: "Rename APK"
        run: |
          chmod +x workflows/scripts/flutter/android/rename-apk.sh
          workflows/scripts/flutter/android/rename-apk.sh "$FLUTTER_BASE" "${{ vars.APP_NAME }}" "$APK_SUFFIX" "$APP_VERSION"

      - name: "Create Release"
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ env.FLUTTER_BASE }}/build/app/outputs/flutter-apk/*.apk"
          tag: "${{ github.ref_name }}"
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          token: ${{ secrets.RELEASE_TOKEN }}